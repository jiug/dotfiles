unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on
setw -g mode-keys vi
set-option -g status-position top

bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'jimeh/tmuxifier'
# set desired theme options...
set -g @tmux-gruvbox 'dark256' # or 'dark256', 'light', 'light256'
set -g @tmux-gruvbox-statusbar-alpha 'true'

# Other examples:
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

#This allows for kitty to show images when using molten
set -g allow-passthrough on

# Kitty graphics protocol support - proper setup
set -g default-terminal "xterm-kitty"
set -g terminal-overrides ',xterm-kitty:RGB'
set -g terminal-overrides ',tmux-256color:Tc'
set -g terminal-overrides ',screen-256color:Tc'

# Force xterm-kitty terminal type and PYTHONPATH for all panes
set-hook -g after-new-window "set-env -g TERM xterm-kitty; set-env -g PYTHONPATH ~/Learning/Máster/env/lib/python3.12/site-packages:~/.local/lib/python3.12/site-packages"
set-hook -g after-new-session "set-env -g TERM xterm-kitty; set-env -g PYTHONPATH ~/Learning/Máster/env/lib/python3.12/site-packages:~/.local/lib/python3.12/site-packages"

# This is crucial for graphics protocol to work through tmux
set -g @kitten-enabled 1

#This allows tmux to use extended keys like the F1-12 on the keyboard
set -g extended-keys on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
