# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include current-theme.conf
# END_KITTY_THEME

# Font
font_family FiraCode Nerd Font Mono
bold_font		auto
italic_font		auto
bold_italic_font	auto

# Notify on long command
notify_on_cmd_finish invisible 20

# Tab bar
tab_bar_style powerline
tab_powerline_style angled

# Disable application key mode to prevent duplicate key events
enable_audio_bell no
input_delay 0

# Fix for double keystroke issue - CRITICAL
env TERM xterm-kitty
term xterm-kitty

shell /usr/bin/fish

# Shell integration (handles TMUX title and cwd updates)
shell_integration disabled
